services:

  web:
    image: ghcr.io/2killah/django-docker-ci:latest
    container_name: django_web

    ports:
      - "8000:8000"

    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: django_db

    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: